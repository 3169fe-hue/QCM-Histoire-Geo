function melanger(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function noteSur20(b,t){if(t===0)return 0;return Math.round((b/t)*20*10)/10}

<div class="cycle-card cycle-lycee" onclick="ouvrirCycle('lycee')"><div class="cycle-icon">🎓</div><div class="cycle-body"><div class="cycle-title">${CYCLES.lycee.titre}</div><div class="cycle-sub">${CYCLES.lycee.sousTitre}</div></div><div class="cycle-arrow">›</div></div>
<div class="author-card">

</div>
<footer>Programme officiel du Bénin<br>${tQ} questions • ${tD} classes disponibles</footer>`;
}
function renderCycle(){
const cy=CYCLES[state.cycle];let h='';
cy.classes.forEach(code=>{
const c=CLASSES[code];const saT=SA_TITLES[code];const nb=Q.filter(q=>q.c===code).length;const dispo=c.dispo&&saT;
const cls='card'+(state.cycle==='lycee'?' lycee':'')+(!dispo?' bientot':'');const act=dispo?`onclick="ouvrirClasse('${code}')"`:'';
let meta,sl='';if(dispo){const nSA=Object.keys(saT).length;meta=`${nSA} séries • ${nb} questions`;const b=totalBestForClasse(code);if(b>0)sl=`<div class="card-score">Total meilleurs : ${b}</div>`}else{meta='Contenu à venir'}
h+=`<div class="${cls}" ${act}><div class="badge">${c.label}</div><div class="card-body"><div class="card-title">${c.titre}</div><div class="card-meta">${meta}</div>${sl}</div></div>`});
return `<header class="with-back"><button class="back-btn" onclick="retourAccueil()">←</button><div><h1>${cy.titre}</h1><p>${cy.sousTitre}</p></div></header><div class="section-title">Choisir une classe</div>${h}`;
}
function renderClasse(){
const cl=CLASSES[state.classe];const saT=SA_TITLES[state.classe];let h='';
Object.keys(saT).forEach(sn=>{const sa=saT[sn];const nb=Q.filter(q=>q.c===state.classe&&q.s===parseInt(sn)).length;const b=getBestScore(state.classe,sn);const bt=b>0?`Meilleur : ${b}/${nb}`:'Pas encore essayé';
const cls=sa.disc==='Géographie'?'card lycee':'card';
h+=`<div class="${cls}" onclick="demarrer(${sn})"><div class="badge">${sn}</div><div class="card-body"><div class="card-title">${sa.title}</div><div class="card-meta">${sa.disc} • ${nb} questions</div><div class="card-score">${bt}</div></div></div>`});
const hasGlossary=(GLOSSARY[state.classe]||[]).length>0;
const glossBtn=hasGlossary?`<div class="glossary-btn" onclick="ouvrirGlossaire('${state.classe}')">📖 Consulter le glossaire (${GLOSSARY[state.classe].length} termes)</div>`:'';
const examBtn=`<div class="exam-btn" onclick="demarrerExamen(20)">🎯 Mode Examen (20 questions mélangées)</div>`;
const fichesBtn=`<div class="fiches-btn" onclick="ouvrirFiches('${state.classe}')">📝 Fiches de révision</div>`;
return `<header class="with-back"><button class="back-btn" onclick="retourCycle()">←</button><div><h1>${cl.titre}</h1><p>${CYCLES[cl.cycle].titre} — Situations d'apprentissage</p></div></header>${examBtn}${fichesBtn}${glossBtn}<div class="section-title">Situations d'apprentissage</div>${h}`;
}
function renderGlossaire(){
const cl=CLASSES[state.classe];const list=GLOSSARY[state.classe]||[];
return `<header class="with-back"><button class="back-btn" onclick="retourClasse()">←</button><div><h1>Glossaire — ${cl.titre}</h1><p>${list.length} termes du programme</p></div></header>
<input type="text" class="search-box" placeholder="🔍 Rechercher un terme..." oninput="filtrerGlossaire(this.value)" value="${state.glossFilter||''}">
<div class="term-count" id="gloss-count"></div>
<div id="gloss-list"></div>`;
}
function filtrerGlossaire(v){state.glossFilter=v.toLowerCase();renderGlossaireContent()}
function renderGlossaireContent(){
const list=GLOSSARY[state.classe]||[];const f=state.glossFilter||'';
const filtered=f?list.filter(x=>x.t.toLowerCase().includes(f)||x.d.toLowerCase().includes(f)):list;
const el=document.getElementById('gloss-list');if(!el)return;
let h='';
if(filtered.length===0){h='<div class="empty-state"><div class="big-icon">🔍</div><h2>Aucun résultat</h2><p>Essayez un autre terme.</p></div>'}
else{filtered.forEach(x=>{h+=`<div class="term-item"><div class="term-name">${x.t}</div><div class="term-def">${x.d}</div></div>`})}
el.innerHTML=h;
const cnt=document.getElementById('gloss-count');if(cnt)cnt.textContent=`${filtered.length} terme${filtered.length>1?'s':''} affiché${filtered.length>1?'s':''}`;
}
function renderFiches(){
const cl=CLASSES[state.classe];const rev=REVISIONS[state.classe]||{};let h='';
Object.keys(rev).forEach(num=>{const r=rev[num];let pts='';r.pts.forEach(p=>{pts+=`<div class="term-def" style="margin:6px 0 6px 15px">• ${p}</div>`});
h+=`<div class="term-item"><div class="term-name">SA n°${num} — ${r.t}</div>${pts}</div>`});
return `<header class="with-back"><button class="back-btn" onclick="retourClasse()">←</button><div><h1>Fiches de révision — ${cl.titre}</h1><p>Résumé par Situation d'Apprentissage</p></div></header><div class="term-count">${Object.keys(rev).length} fiches disponibles</div>${h}`;
}
function ouvrirFiches(c){state.screen='fiches';state.classe=c;render()}
function ouvrirGlossaire(c){state.screen='glossaire';state.classe=c;state.glossFilter='';render()}
function renderQuiz(){
const q=state.questions[state.index];const t=state.questions.length;const p=(state.index/t)*100;
const ans=state.answers.length>state.index;const cur=ans?state.answers[state.index]:null;
const L=['A','B','C','D'];let oh='';
q.opts.forEach((o,i)=>{
let c='option';
if(state.isExam){
if(ans&&cur.chosen===i)c+=' selected';
}else if(ans){c+=' disabled';if(i===q.correct)c+=' correct';else if(i===cur.chosen)c+=' wrong';}
const a=(state.isExam)?`onclick="choisirOption(${i})"`:(ans?'':`onclick="repondre(${i})"`);
oh+=`<div class="${c}" ${a}><div class="letter">${L[i]}</div><div>${o}</div></div>`;});
let eh='',nb='';
if(state.isExam){
nb=ans?`<button class="btn btn-primary" onclick="suivante()">${state.index===t-1?'Terminer l\'examen':'Question suivante →'}</button>`:`<button class="btn btn-secondary" disabled>Sélectionne une réponse</button>`;
}else if(ans){
eh=`<div class="explanation"><strong>Explication</strong>${q.exp}</div>`;
nb=`<button class="btn btn-primary" onclick="suivante()">${state.index===t-1?'Voir mon résultat':'Question suivante →'}</button>`;}
const headerTitle=state.isExam?'🎯 Mode Examen':`${CLASSES[state.classe].titre} — Série ${state.sa}`;
const headerSub=state.isExam?`Question ${state.index+1} sur ${t}`:SA_TITLES[state.classe][state.sa].title;
const timerHtml=state.isExam?`<span class="timer" id="timer-display">⏱ 0:00</span>`:'';
const themeHtml=state.isExam?`<span>Question ${state.index+1} / ${t}</span>${timerHtml}`:`<span>Question ${state.index+1} / ${t}</span><span>${state.score} bonne${state.score>1?'s':''}</span>`;
return `<header class="with-back"><button class="back-btn" onclick="quitterQuiz()">←</button><div><h1>${headerTitle}</h1><p>${headerSub}</p></div></header>
<div class="quiz-header">${themeHtml}</div>
<div class="progress"><div class="progress-fill" style="width:${p}%"></div></div>
<div class="question"><div class="theme-tag">${q.theme}</div>${q.q}</div>${oh}${eh}${nb}`;
}
function choisirOption(c){
if(state.answers.length>state.index){state.answers[state.index]={chosen:c,correct:c===state.questions[state.index].correct};render();return;}
state.answers.push({chosen:c,correct:c===state.questions[state.index].correct});render();
}
function renderResult(){
if(state.isExam){return renderExamResult();}
const t=state.questions.length;const b=state.score;const n=noteSur20(b,t);let sc='';if(n<8)sc='fail';else if(n<12)sc='mid';
let rh='';const err=state.answers.map((a,i)=>({...a,q:state.questions[i],index:i})).filter(a=>!a.correct);
if(err.length>0){rh=`<div class="section-title">À revoir (${err.length})</div>`;err.forEach(e=>{rh+=`<div class="review-item"><div class="review-q">${e.q.q}</div><div class="review-a"><strong>Bonne réponse :</strong> ${e.q.opts[e.q.correct]}</div></div>`})}
return `<header class="with-back"><button class="back-btn" onclick="retourClasse()">←</button><div><h1>Résultat</h1><p>${CLASSES[state.classe].titre} — Série ${state.sa}</p></div></header>
<div class="result-card"><div class="result-score ${sc}">${n}<span style="font-size:24px;color:#888;">/20</span></div><div class="result-label">Ta note</div><div class="result-detail">${b} bonne${b>1?'s':''} réponse${b>1?'s':''} sur ${t}</div><div class="result-message">${messageResultat(n)}</div></div>
${rh}<button class="btn btn-primary" onclick="demarrer(${state.sa})">↻ Refaire cette série</button><button class="btn btn-secondary" onclick="retourClasse()">← Retour aux séries</button>`;
}
function renderExamResult(){
const t=state.questions.length;
const bonnes=state.answers.filter(a=>a.correct).length;
const n=noteSur20(bonnes,t);let sc='';if(n<8)sc='fail';else if(n<12)sc='mid';
const elapsed=Math.floor((Date.now()-state.startTime)/1000);
const duree=`${Math.floor(elapsed/60)} min ${elapsed%60} s`;
let rh='<div class="section-title">Correction détaillée</div>';
state.answers.forEach((a,i)=>{const q=state.questions[i];const correctTxt=q.opts[q.correct];
const chosenTxt=a.chosen!=null?q.opts[a.chosen]:'Aucune réponse';
rh+=`<div class="review-item" style="${a.correct?'border-left-color:#008751':''}">
<div class="review-q">${i+1}. ${q.q}</div>
<div class="review-a" style="color:#E8112D"><strong style="color:#888;">Ta réponse :</strong> ${chosenTxt}</div>
<div class="review-a"><strong>Bonne réponse :</strong> ${correctTxt}</div>
</div>`;});
return `<header class="with-back"><button class="back-btn" onclick="retourClasse()">←</button><div><h1>🎯 Résultat Examen</h1><p>${CLASSES[state.classe].titre} — ${t} questions</p></div></header>
<div class="result-card"><div class="result-score ${sc}">${n}<span style="font-size:24px;color:#888;">/20</span></div><div class="result-label">Ta note</div><div class="result-detail">${bonnes} bonne${bonnes>1?'s':''} réponse${bonnes>1?'s':''} sur ${t}</div><div class="result-detail">⏱ Durée : ${duree}</div><div class="result-message">${messageResultat(n)}</div></div>
${rh}<button class="btn btn-primary" onclick="retourClasse()">← Retour à la classe</button>`;
}
function demarrerExamen(nb){
let pool = Q.filter(q=>q.c===state.classe).map(toFull);
pool = melanger(pool).slice(0, Math.min(nb, pool.length));
pool = pool.map(q=>{const ix=q.opts.map((o,i)=>({o,c:i===q.correct}));const sh=melanger(ix);return{...q,opts:sh.map(x=>x.o),correct:sh.findIndex(x=>x.c)}});
state.screen='quiz';state.isExam=true;state.sa=null;
state.questions=pool;state.index=0;state.answers=[];state.score=0;
state.startTime=Date.now();
if(state.timerId)clearInterval(state.timerId);
state.timerId=setInterval(()=>{
const el=document.getElementById('timer-display');
if(el){const s=Math.floor((Date.now()-state.startTime)/1000);el.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
},1000);
render();
}
function terminerExamen(){
if(state.timerId)clearInterval(state.timerId);
state.timerId=null;
state.screen='result';render();
}
function ouvrirCycle(c){state.screen='cycle';state.cycle=c;render()}
function ouvrirClasse(c){state.screen='classe';state.classe=c;render()}
function retourAccueil(){state.screen='home';state.cycle=null;state.classe=null;render()}
function retourCycle(){state.screen='cycle';state.classe=null;render()}
function retourClasse(){state.screen='classe';render()}
function quitterQuiz(){
const msg=state.isExam?"Quitter l'examen ? Ta progression sera perdue.":"Quitter cette série ? Ta progression ne sera pas enregistrée.";
if(confirm(msg)){
if(state.timerId){clearInterval(state.timerId);state.timerId=null}
state.isExam=false;
state.screen='classe';render();
}}
function demarrer(sa){
if(state.timerId){clearInterval(state.timerId);state.timerId=null}
let pool=Q.filter(q=>q.c===state.classe&&q.s===sa).map(toFull);
pool=melanger(pool).map(q=>{const ix=q.opts.map((o,i)=>({o,c:i===q.correct}));const sh=melanger(ix);return{...q,opts:sh.map(x=>x.o),correct:sh.findIndex(x=>x.c)}});
state.screen='quiz';state.sa=sa;state.isExam=false;state.questions=pool;state.index=0;state.answers=[];state.score=0;render();
}
function repondre(c){if(state.answers.length>state.index)return;const q=state.questions[state.index];const cor=c===q.correct;state.answers.push({chosen:c,correct:cor});if(cor)state.score++;render()}
function suivante(){
if(state.isExam){
if(state.index<state.questions.length-1){state.index++;render()}
else{terminerExamen()}
}else{
if(state.index<state.questions.length-1){state.index++;render()}
else{setBestScore(state.classe,state.sa,state.score);state.screen='result';render()}
}}
render();
</script>
